name: Supabase wach halten

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  anstupsen:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank abfragen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TABELLE: einstellungen
        run: |
          # Basis-URL normalisieren: Schraegstrich und ein evtl. schon
          # im Secret enthaltenes /rest/v1 entfernen (sonst PGRST125)
          basis="${SUPABASE_URL%/}"
          basis="${basis%/rest/v1}"
          basis="${basis%/}"
          pfad="/rest/v1/$TABELLE?select=*&limit=1"
          ziel="$basis$pfad"
          echo "Angefragter Pfad: $pfad"

          # Body und Statuscode gemeinsam holen, Statuscode in der letzten Zeile
          antwort=$(curl -sS -w $'\n%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$ziel")

          code=$(printf '%s' "$antwort" | tail -n 1)
          body=$(printf '%s' "$antwort" | sed '$d')

          echo "Statuscode: $code"
          echo "Antwort der Datenbank: $body"

          if [ "$code" != "200" ]; then
            echo "::error::Die Datenbank hat mit $code geantwortet: $body"
            exit 1
          fi

          echo "Datenbank ist wach."
