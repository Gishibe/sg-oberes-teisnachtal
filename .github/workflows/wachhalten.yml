name: Supabase wach halten

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  anstupsen:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank abfragen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TABELLE: keepalive
        run: |
          # ---- 1. Secrets pruefen -------------------------------------
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Das Secret SUPABASE_URL ist leer oder existiert nicht."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Das Secret SUPABASE_ANON_KEY ist leer oder existiert nicht."
            exit 1
          fi

          # ---- 2. URL saeubern ----------------------------------------
          # Leerzeichen, Zeilenumbrueche und Anfuehrungszeichen entfernen
          basis=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | tr -d '"'"'")
          basis="${basis%/}"
          basis="${basis%/rest/v1}"
          basis="${basis%/}"

          # ---- 3. URL kontrollieren -----------------------------------
          case "$basis" in
            https://*.supabase.co) ;;
            https://*)
              echo "Warnung: URL endet nicht auf .supabase.co - eigene Domain?" ;;
            *)
              echo "::error::SUPABASE_URL beginnt nicht mit https:// (Laenge: ${#basis} Zeichen)."
              echo "Erwartet wird genau: https://<projekt-ref>.supabase.co"
              exit 1 ;;
          esac

          host="${basis#https://}"
          host="${host%%/*}"
          echo "Hostname: $host"

          # ---- 4. Abfrage ---------------------------------------------
          pfad="/rest/v1/$TABELLE?select=*&limit=1"
          echo "Angefragter Pfad: $pfad"

          antwort=$(curl -sS -w $'\n%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$basis$pfad")

          code=$(printf '%s' "$antwort" | tail -n 1)
          body=$(printf '%s' "$antwort" | sed '$d')

          echo "Statuscode: $code"
          echo "Antwort der Datenbank: $body"

          if [ "$code" != "200" ]; then
            echo "::error::Die Datenbank hat mit $code geantwortet: $body"
            exit 1
          fi

          echo "Datenbank ist wach."
