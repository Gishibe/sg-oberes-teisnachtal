name: Supabase wach halten

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  anstupsen:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank abfragen
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/einstellungen?select=id&limit=1")
          echo "Antwort der Datenbank: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Die Datenbank hat mit $code geantwortet."
            exit 1
          fi
